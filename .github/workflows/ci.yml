name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2-audit-platform/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check app tests

      - name: Run Mypy Typecheck
        run: mypy app tests/unit/test_health.py

      - name: Run Pytest
        run: pytest

  frontend-quality:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2-audit-platform/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: track2-audit-platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2-audit-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy example environment
        run: cp .env.example .env

      - name: Validate Docker Compose Config
        run: docker compose config
