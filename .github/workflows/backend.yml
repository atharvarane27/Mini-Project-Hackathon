name: backend

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2-audit-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: track2-audit-platform/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m mypy --strict app
      - run: python -m pytest -q -p no:cacheprovider
