services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditforge-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_BACKEND=${DB_BACKEND:-supabase}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@localhost:5432/audit_forge}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditforge-worker
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - .env
    environment:
      - DB_BACKEND=${DB_BACKEND:-supabase}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@localhost:5432/audit_forge}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: auditforge-local-postgres
    profiles:
      - local-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audit_forge
    volumes:
      - local_pg_data:/var/lib/postgresql/data
      - ./infra/local-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit_forge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  local_pg_data:
